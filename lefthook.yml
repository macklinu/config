pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: '*.{js,jsx,ts,tsx,md,yml,yaml,json}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
